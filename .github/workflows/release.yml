name: Release to npm

# Publishes the package to npm whenever a semver tag like v1.0.0 is pushed.
# Uses npm trusted publishing via GitHub Actions OIDC; no NPM_TOKEN secret is required.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build --if-present

      - name: Publish to npm with trusted publishing
        run: npm publish --access public --provenance

  changelog:
    # Prereleases are published to npm, but only stable releases enter the changelog.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout main and all tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate changelog and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Not a stable semver tag: $RELEASE_TAG"
            exit 0
          fi
          git merge-base --is-ancestor "$RELEASE_TAG" HEAD || { echo "Tag is not reachable from main"; exit 1; }
          node scripts/changelog.mjs --release "$RELEASE_TAG"

      - name: Commit changelog to main
        run: |
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: update changelog [skip ci]'
          # A concurrent main update makes this fail rather than overwriting it.
          git push origin HEAD:main
